name: Test package

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Initialise project
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            sudo apt-get update -y
            sudo apt-get install -y cpanminus ghostscript libwx-perl perl-base poppler-utils xdg-utils
            cpanm Dist::Zilla
            dzil authordeps --missing | cpanm

      - name: Show Perl configuration
        run: |
          perl '-V:.*'

      - name: Build project
        run: |
          dzil build
          cpamn App-PDFLibrarian-*.tar.*

  all-done:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: All done
        run: |
          echo All done
