name: Test package

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install system packages
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 1
          retry_wait_seconds: 30
          command: |
            sudo apt-get update -y
            sudo apt-get install -y cpanminus ghostscript libwx-perl perl-base poppler-utils xdg-utils

      - name: Setup Perl local lib
        run: |
          echo "PERL_LOCAL_LIB_ROOT=$HOME/perl5" >> $GITHUB_ENV
          echo "$HOME/perl5/bin" >> $GITHUB_PATH
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> $GITHUB_ENV
          echo "PERL_MM_OPT=INSTALL_BASE=$HOME/perl5" >> $GITHUB_ENV
          echo "PERL_MB_OPT=--install_base $HOME/perl5" >> $GITHUB_ENV

      - name: Show Perl configuration
        run: |
          perl "-V:.*"

      - name: Install CPAN packages
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 20
          max_attempts: 1
          retry_wait_seconds: 30
          command: |
            cpanm Dist::Zilla

      - name: Install Dist::Zilla dependencies
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 1
          retry_wait_seconds: 30
          command: |
            dzil authordeps --missing | cpanm

      - name: Build project
        run: |
          dzil build

      - name: Install project
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 20
          max_attempts: 1
          retry_wait_seconds: 30
          command: |
            cpanm App-PDFLibrarian-*.tar.*

  all-done:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: All done
        run: |
          echo All done
